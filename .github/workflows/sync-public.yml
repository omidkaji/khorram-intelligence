name: Sync public Google Sheets data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public Google Sheets data
        env:
          KHORRAM_API_URL: https://script.google.com/macros/s/AKfycbzR_WYhmZn_dPL2N0o2_sXGBcxYJX1svylAJ1fIkcRnIZ_D3agwn6cXG82F2poyimik/exec
        run: python3 scripts/sync_public.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync public dashboard data"
            git push
          fi
